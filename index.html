<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Typing Speed Test - Advanced (WPS)</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: Arial, sans-serif;
      }

      body {
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        background: #f5f6fa;
        transition: 0.3s;
      }

      body.dark {
        background: #2d3436;
        color: #dfe6e9;
      }

      .container {
        width: 650px;
        max-width: 95%;
        background: #fff;
        padding: 20px;
        border-radius: 12px;
        text-align: center;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        transition: 0.3s;
      }

      body.dark .container {
        background: #353b48;
      }

      h1 {
        margin-bottom: 15px;
      }

      #text-display {
        font-size: 18px;
        padding: 15px;
        border-radius: 10px;
        background: #f1f2f6;
        min-height: 80px;
        margin-bottom: 15px;
      }

      body.dark #text-display {
        background: #2f3640;
      }

      #text-input {
        width: 100%;
        padding: 12px;
        font-size: 16px;
        border: 2px solid #dfe6e9;
        border-radius: 8px;
        margin-bottom: 15px;
      }

      .stats {
        display: flex;
        justify-content: space-around;
        margin-bottom: 15px;
      }

      .stat-box {
        background: #f1f2f6;
        padding: 10px;
        border-radius: 8px;
        width: 30%;
      }

      body.dark .stat-box {
        background: #2f3640;
      }

      button,
      select {
        padding: 10px 20px;
        font-size: 16px;
        margin: 5px;
        border-radius: 8px;
        border: none;
        cursor: pointer;
        transition: 0.3s;
      }

      #start-btn {
        background: #0984e3;
        color: #fff;
      }
      #start-btn:hover {
        background: #0652dd;
      }
      #theme-btn {
        background: #636e72;
        color: #fff;
      }
      #theme-btn:hover {
        background: #2d3436;
      }

      .correct {
        color: green;
      }
      .incorrect {
        color: red;
        text-decoration: underline;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>⚡ Typing Speed Test</h1>

      <label>
        Difficulty:
        <select id="difficulty">
          <option value="easy">Easy</option>
          <option value="medium">Medium</option>
          <option value="hard">Hard</option>
        </select>
      </label>

      <div id="text-display"></div>
      <textarea
        id="text-input"
        rows="4"
        placeholder="Start typing..."
        disabled
      ></textarea>

      <div class="stats">
        <div class="stat-box">⏱ Time: <span id="timer">30</span>s</div>
        <div class="stat-box">⚡ WPS: <span id="wps">0</span></div>
        <div class="stat-box">🎯 Accuracy: <span id="accuracy">0</span>%</div>
      </div>

      <button id="start-btn">Start Test</button>
      <button id="theme-btn">🌙 Toggle Theme</button>
    </div>

    <script>
      const textDisplay = document.getElementById("text-display");
      const textInput = document.getElementById("text-input");
      const timerEl = document.getElementById("timer");
      const wpsEl = document.getElementById("wps");
      const accuracyEl = document.getElementById("accuracy");
      const startBtn = document.getElementById("start-btn");
      const themeBtn = document.getElementById("theme-btn");
      const difficultyEl = document.getElementById("difficulty");

      let timer = 30,
        timeInterval,
        isRunning = false;
      let currentText = "",
        typedCharacters = 0,
        correctCharacters = 0;

      const texts = {
        easy: [
          "The quick brown fox jumps over the lazy dog.",
          "Typing fast is fun.",
          "Hello world from JavaScript.",
        ],
        medium: [
          "Web development is a combination of creativity and logic.",
          "Typing speed tests are great practice for improving focus.",
          "JavaScript powers interactive websites all around the world.",
        ],
        hard: [
          "Consistency in practice will eventually lead to mastery of web development skills.",
          "Advanced applications require a strong foundation in JavaScript and problem solving.",
          "Typing tests not only improve accuracy but also enhance brain hand coordination significantly.",
        ],
      };

      function startTest() {
        timer = 30;
        typedCharacters = 0;
        correctCharacters = 0;
        isRunning = true;

        let diff = difficultyEl.value;
        currentText =
          texts[diff][Math.floor(Math.random() * texts[diff].length)];
        textDisplay.textContent = currentText;

        textInput.value = "";
        textInput.disabled = false;
        textInput.focus();
        timerEl.textContent = timer;
        wpsEl.textContent = 0;
        accuracyEl.textContent = 0;

        clearInterval(timeInterval);
        timeInterval = setInterval(updateTimer, 1000);
      }

      function updateTimer() {
        if (timer > 0) {
          timer--;
          timerEl.textContent = timer;
        } else {
          endTest();
        }
      }

      function endTest() {
        clearInterval(timeInterval);
        textInput.disabled = true;
        isRunning = false;
      }

      function calculateResults() {
        let words = textInput.value.trim().split(/\s+/).length;
        let elapsedTime = 30 - timer; // time spent typing
        let wps = elapsedTime > 0 ? (words / elapsedTime).toFixed(2) : 0;
        let accuracy =
          Math.round((correctCharacters / typedCharacters) * 100) || 0;

        wpsEl.textContent = wps;
        accuracyEl.textContent = accuracy;
      }

      textInput.addEventListener("input", () => {
        let inputText = textInput.value;
        typedCharacters++;

        let highlighted = "";
        correctCharacters = 0;
        for (let i = 0; i < currentText.length; i++) {
          if (i < inputText.length) {
            if (inputText[i] === currentText[i]) {
              correctCharacters++;
              highlighted += `<span class="correct">${currentText[i]}</span>`;
            } else {
              highlighted += `<span class="incorrect">${currentText[i]}</span>`;
            }
          } else {
            highlighted += currentText[i];
          }
        }
        textDisplay.innerHTML = highlighted;
        calculateResults();
      });

      startBtn.addEventListener("click", startTest);
      themeBtn.addEventListener("click", () => {
        document.body.classList.toggle("dark");
      });
    </script>
  </body>
</html>
