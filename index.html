<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Typing Speed Test - Advanced (WPS)</title>
    <link rel="stylesheet" href="style.css"> 
  </head>
  <body>
    <div class="container">
      <h1>⚡ Typing Speed Test</h1>

      <label>
        Difficulty:
        <select id="difficulty">
          <option value="easy">Easy</option>
          <option value="medium">Medium</option>
          <option value="hard">Hard</option>
        </select>
      </label>

      <div id="text-display"></div>
      <textarea
        id="text-input"
        rows="4"
        placeholder="Start typing..."
        disabled
      ></textarea>

      <div class="stats">
        <div class="stat-box">⏱ Time: <span id="timer">30</span>s</div>
        <div class="stat-box">⚡ WPS: <span id="wps">0</span></div>
        <div class="stat-box">🎯 Accuracy: <span id="accuracy">0</span>%</div>
      </div>

      <button id="start-btn">Start Test</button>
      <button id="theme-btn">🌙 Toggle Theme</button>
    </div>

    <script src="script.js"></script>
  </body>
</html>
